name: Routee App Store Downloads

on:
  schedule:
    # Wednesday 10:17 Asia/Seoul. Report window: previous Monday–Sunday in UTC.
    - cron: '17 1 * * 3'
  workflow_dispatch:
    inputs:
      period:
        description: '조회 기간 (Apple UTC 기준)'
        type: choice
        options:
          - last_week
          - last_7_days
          - last_30_days
        default: last_week
        required: true
      send_to_discord:
        description: '디스코드에 전송 (해제하면 API 조회만 검증)'
        type: boolean
        default: true
        required: true
  pull_request:
    paths:
      - 'automation/app-store-discord/**'
      - '.github/workflows/app-store-downloads.yml'

permissions:
  contents: read

jobs:
  test:
    name: Validate report logic
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Run tests without credentials
        working-directory: automation/app-store-discord
        run: npm test

  report:
    name: Collect and deliver
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.repository == 'Team-Routee/Routee-iOS' &&
      github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: routee-app-store-downloads-delivery
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Collect Apple report and optionally post to Discord
        working-directory: automation/app-store-discord
        env:
          ASC_APP_ID: '6791870747'
          ASC_KEY_ID: ${{ secrets.ROUTEE_ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ROUTEE_ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ROUTEE_ASC_PRIVATE_KEY }}
          ASC_REPORT_REQUEST_ID: ${{ vars.ROUTEE_ASC_REPORT_REQUEST_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.ROUTEE_DISCORD_WEBHOOK_URL }}
          REPORT_PERIOD: ${{ inputs.period || 'last_week' }}
          REPORT_SEND: ${{ github.event_name == 'schedule' || inputs.send_to_discord }}
        shell: bash
        run: |
          args=(--period "$REPORT_PERIOD")
          if [[ "$REPORT_SEND" == 'true' ]]; then
            args+=(--send)
          fi
          node scripts/run-report.mjs "${args[@]}"
